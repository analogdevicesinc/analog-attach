name: testboard
type: platform_board
version: "1.0.0"
description: "A board carrying testsoc"

metadata:
  mcu: testsoc
  vendor: testvendor

# A PMOD port, so a PMOD eval board mates with it pin-for-pin and needs no wiring stated,
# plus a header of a different standard, so a stated wire can land somewhere else.
pinout:
  connectors:
    - name: "PMOD port"
      id: PMOD
      type: pmod_12
      pins:
        - {pin: 1, mnemonic: T0_4, role: [gpio, spi_cs],   gpio: {port: TEST_GPIO0, number: 4}}
        - {pin: 2, mnemonic: T0_5, role: [gpio, spi_mosi], gpio: {port: TEST_GPIO0, number: 5}}
        - {pin: 3, mnemonic: T0_6, role: [gpio, spi_miso], gpio: {port: TEST_GPIO0, number: 6}}
        - {pin: 4, mnemonic: T0_7, role: [gpio, spi_sck],  gpio: {port: TEST_GPIO0, number: 7}}
        - {pin: 5, mnemonic: GND,  role: ground}
    - name: "Expansion header"
      id: H1
      type: feather_16
      pins:
        - {pin: 1, mnemonic: T1_3, role: gpio, gpio: {port: TEST_GPIO1, number: 3}}
        # On a port the BSP configures no gpio_port for, to exercise that gap.
        - {pin: 2, mnemonic: T3_1, role: gpio, gpio: {port: TEST_GPIO3, number: 1}}
        - {pin: 3, mnemonic: 3V3,  role: power}
    - name: "On-board"
      id: onboard
      pins:
        - {pin: T0_9, mnemonic: LED, role: gpio, gpio: {port: TEST_GPIO0, number: 9}}
