    - "maxim_spi.h"
  sources:
    - "maxim_spi.c"
  api:
    headers:
      - "no_os_dma.h"
      - "no_os_irq.h"
    sources:
      - "no_os_dma.c"
      - "no_os_irq.c"
  platform:
    headers:
      - "../common/maxim_dma.h"
      - "maxim_irq.h"
