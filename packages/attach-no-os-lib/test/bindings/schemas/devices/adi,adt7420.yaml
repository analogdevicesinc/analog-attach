$id: "devices/adi,adt7420.yaml"
$type: struct
$symbol: adt7420_init_param
$description: "ADT7420/ADT7320 Temperature Sensor"
$ranking: 4
$sources:
  headers:
    - "drivers/temperature/adt7420/adt7420.h"
  sources:
    - "drivers/temperature/adt7420/adt7420.c"
  api:
    headers:
      - "no_os_i2c.h"
      - "no_os_spi.h"
    sources:
      - "no_os_i2c.c"
      - "no_os_spi.c"
  $note: "Driver header includes both I2C and SPI regardless of interface selection"

active_device:
  type: enum
  required: true
  values: [ID_ADT7420, ID_ADT7320]
  default: ID_ADT7420
  description: "Device type (ADT7420=I2C, ADT7320=SPI)"

resolution_setting:
  type: uint8_t
  default: 1
  description: "Resolution setting (0=13-bit, 1=16-bit)"

interface_init:
  type: union
  required: true
  description: "Communication interface parameters"
  members:
    - i2c_init:
        include: "no-os/no_os_i2c_init_param.yaml"
        description: "I2C initialization parameters"
    - spi_init:
        include: "no-os/no_os_spi_init_param.yaml"
        description: "SPI initialization parameters"

$override:
  - $switch:
      $on: active_device
      $cases:
        ID_ADT7420:
          interface_init:
            value: i2c_init
        ID_ADT7320:
          interface_init:
            value: spi_init
