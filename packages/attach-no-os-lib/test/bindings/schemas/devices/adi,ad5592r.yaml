$id: "devices/adi,ad5592r.yaml"
$type: device
$symbol: ad5592r_init_param
$description: "AD5592R 8-channel, 12-bit configurable ADC/DAC with GPIO"
$ranking: 4
$header: "drivers/adc-dac/ad5592r/ad5592r.h"
$init_function: ad5592r_init
$remove_function: ad5592r_remove
$descriptor: ad5592r_dev
$init_by_pointer: true
$sources:
  noos:
    - "drivers/adc-dac/ad5592r/ad5592r-base.h"
    - "drivers/adc-dac/ad5592r/ad5592r-base.c"
    - "drivers/adc-dac/ad5592r/ad5592r.c"

int_ref:
  type: bool
  default: true
  description: "Use internal reference"

external_vref:
  type: uint32_t
  description: "External reference voltage in mV (valid only if int_ref = false)"

spi_init:
  include: "no-os/no_os_spi_init_param.yaml"
  pointer: true
  description: "SPI initialization parameters (for AD5592R)"

i2c_init:
  include: "no-os/no_os_i2c_init_param.yaml"
  pointer: true
  description: "I2C initialization parameters (for AD5593R variant)"

ss_init:
  include: "no-os/no_os_gpio_init_param.yaml"
  pointer: true
  description: "Slave select GPIO initialization parameters"

channel_modes:
  type: array
  size: 8
  element:
    include: "devices/ad5592r-enums/ad5592r_channel_mode.yaml"
  description: "Mode configuration for each of the 8 channels"

channel_offstate:
  type: array
  size: 8
  element:
    include: "devices/ad5592r-enums/ad5592r_channel_offstate.yaml"
  description: "Off-state configuration for each of the 8 channels"

adc_range:
  include: "devices/ad5592r-enums/ad559xr_range.yaml"
  description: "ADC input voltage range"

dac_range:
  include: "devices/ad5592r-enums/ad559xr_range.yaml"
  description: "DAC output voltage range"

adc_buf:
  type: bool
  default: false
  description: "Enable ADC precharge buffer for improved performance"

power_down:
  type: array
  size: 8
  element:
    type: uint8_t
  description: "Power down state for each of the 8 channels (0 = enabled, 1 = powered down)"

$override:
  # - $if:
  #     spi_init:
  #       value: $any
  #   $then:
  #     i2c_init:
  #       disabled: true
  #
  # - $if:
  #     i2c_init:
  #       value: $any
  #   $then:
  #     spi_init:
  #       disabled: true

  - $mutex: [spi_init, i2c_init]
  - $mutex: [ss_init, i2c_init]
