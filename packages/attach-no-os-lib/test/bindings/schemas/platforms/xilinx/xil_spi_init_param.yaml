$id: "platforms/xilinx/xil_spi_init_param.yaml"
$type: struct
$symbol: xil_spi_init_param
$capability: spi
$description: "Xilinx platform specific SPI initialization parameters"
$ranking: 4
$sources:
  headers:
    - "drivers/platform/xilinx/xilinx_spi.h"

type:
  include: "platforms/xilinx/enums/xil_spi_type.yaml"
  description: "Xilinx architecture (PL, PS, or SPI Engine)"

flags:
  type: uint32_t
  default: 0
  description: "SPI flags (SPI_CS_DECODE = 0x01)"

$override:
  # SPI_PS can only use xil_spi_ops
  - $if:
      $this:
        type:
          value: SPI_PS
    $then:
      $parent:
        platform_ops:
          platforms:
            - include: "platforms/xilinx/platform_ops/spi_ops.yaml"

  # SPI_PL can use xil_spi_ops or xil_spi_pl_ops (direct register access)
  - $if:
      $this:
        type:
          value: SPI_PL
    $then:
      $parent:
        platform_ops:
          platforms:
            - include: "platforms/xilinx/platform_ops/spi_ops.yaml"
            - include: "platforms/xilinx/platform_ops/spi_pl_ops.yaml"

  # SPI_ENGINE must use spi_eng_platform_ops
  - $if:
      type: # $this is inferred
        value: SPI_ENGINE
    $then:
      $parent:
        platform_ops:
          platforms:
            - include: "platforms/xilinx/platform_ops/spi_engine_ops.yaml"
