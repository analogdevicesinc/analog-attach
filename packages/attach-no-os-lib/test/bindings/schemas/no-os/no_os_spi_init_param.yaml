$id: "no-os/no_os_spi_init_param.yaml"
$type: struct
$name: no_os_spi_init_param
$description: "Structure holding the parameters for SPI initialization"
$ranking: 4
$sources:
  headers:
    - "include/no_os_spi.h"
  sources:
    - "drivers/api/no_os_spi.c"

device_id:
  type: uint32_t
  required: true
  description: "SPI peripheral device ID"

max_speed_hz:
  type: uint32_t
  description: "Maximum SPI clock frequency in Hz"

chip_select:
  type: uint8_t
  required: true
  description: "Chip select line number"

mode:
  include: "no-os/enums/no_os_spi_mode.yaml"
  description: "SPI mode (clock polarity and phase)"

bit_order:
  include: "no-os/enums/no_os_spi_bit_order.yaml"
  description: "Bit order (MSB or LSB first)"

platform_ops:
  type: platform_ops
  capability: spi
  target: no_os_spi_platform_ops
  required: true
  description: "Platform-specific SPI operations"

extra:
  type: platform_extra
  capability: spi
  required: true
  description: "Platform-specific initialization parameters"
