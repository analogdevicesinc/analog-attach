$id: "no-os/no_os_pwm_init_param.yaml"
$type: struct
$symbol: no_os_pwm_init_param
$capability: pwm
$description: "Structure containing the init parameters needed by the PWM generator"
$ranking: 4
$sources:
  noos:
    - "include/no_os_pwm.h"

id:
  type: uint32_t
  description: "PWM id (e.g., pin number, timer_id)"

period_ns:
  type: uint32_t
  description: "PWM generator period in nanoseconds"

duty_cycle_ns:
  type: uint32_t
  description: "PWM generator duty cycle in nanoseconds"

phase_ns:
  type: uint32_t
  description: "PWM generator phase in nanoseconds"

polarity:
  include: "no-os/enums/no_os_pwm_polarity.yaml"
  description: "PWM generator polarity"

pwm_gpio:
  include: "no-os/no_os_gpio_init_param.yaml"
  description: "PWM GPIO pin init param"

irq_id:
  type: uint32_t
  description: "IRQ ID"

pwm_callback:
  type: callback_func
  signature: "void (*)(void *)"
  default: "NULL"
  description: "PWM callback function"

platform_ops:
  type: platform_ops
  capability: pwm
  target: no_os_pwm_platform_ops
  description: "PWM platform specific functions"

extra:
  type: platform_extra
  capability: pwm
  description: "PWM extra parameters (platform specific)"
