$id: "test/switch_basic"
$type: struct
$name: test_struct
$ranking: 4
$sources:
  headers:
    - "test.h"

comm_type:
  type: enum
  values: [SPI, I2C]

speed:
  type: uint32_t

$override:
  - $switch:
      $on: comm_type
      $cases:
        SPI:
          speed:
            default: 1000000
        I2C:
          speed:
            default: 400000
