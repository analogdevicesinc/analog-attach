<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="aa-token" content="%AA_TOKEN%">
<title>Attach Studio</title>
<link rel="stylesheet" href="core/core.css">
</head>
<body>
<!-- The core's (core/app.mjs): the header, the setup and the console. <main> is the part of the
     project's ecosystem (ecosystems/<backend>/controller.mjs), mounted by the core. -->
<header>
	<div class="brand"><div class="dot"></div>Attach Studio</div>
	<div class="project">
		<input id="project" spellcheck="false" title="Project folder: where .analog-attach/ and the workfile live">
		<button id="open">Open</button>
		<button id="new-project" title="Set up a new project in a folder">New project</button>
	</div>
	<span id="board" class="chip">…</span>
	<span id="status" class="chip">…</span>
	<div class="spacer"></div>
	<span id="header-actions"></span>
	<button id="setup-button" title="The project setup: ecosystem and settings">Setup</button>
	<button id="refresh" title="Reload everything">↻</button>
	<button id="theme" class="ghost" title="Light / dark">◐</button>
</header>

<main id="main"></main>
<section id="setup" class="content" hidden></section>

<footer id="footer">
	<div class="console-bar">
		<strong>Console</strong><span class="subtle" style="color:#8b95a3">every action is an analog-attach command</span>
		<div class="spacer"></div>
		<span id="console-actions"></span>
		<button id="clear-console">Clear</button>
		<button id="toggle-console">Hide</button>
	</div>
	<div id="console"></div>
</footer>
<div id="toast" class="toast"></div>

<script type="module" src="core/app.mjs"></script>
</body>
</html>
