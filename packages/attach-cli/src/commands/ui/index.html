<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>attach-linux</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
    --bg: #fafafa; --panel: #fff; --line: #dcdfe4; --text: #1f2328; --dim: #6a737d;
    --accent: #0b6bcb; --accent-bg: #e6f0fb; --overlay: #1a7f37; --overlay-bg: #e3f5e8;
    --warn: #9a6700; --warn-bg: #fff4d6; --err: #cf222e; --err-bg: #ffe3e5;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
    :root {
        --bg: #12151a; --panel: #1a1e25; --line: #2d333b; --text: #d7dce2; --dim: #8b949e;
        --accent: #58a6ff; --accent-bg: #16283f; --overlay: #56d364; --overlay-bg: #12301b;
        --warn: #e3b341; --warn-bg: #33290d; --err: #ff7b72; --err-bg: #3d1618;
    }
}
* { box-sizing: border-box; }
body { margin: 0; height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
header { display: flex; gap: 16px; align-items: center; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 15px; margin: 0; }
header .info { color: var(--dim); font-size: 12px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
main { display: grid; grid-template-columns: 340px minmax(0, 1fr) 380px; min-height: 0; }
section { overflow: auto; border-right: 1px solid var(--line); padding: 10px 12px; min-height: 0; }
section:last-child { border-right: 0; }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); margin: 14px 0 6px; }
h2:first-child { margin-top: 0; }
button { font: inherit; padding: 3px 10px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); color: var(--text); cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.danger { color: var(--err); }
input, select { font: inherit; padding: 4px 7px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); color: var(--text); }
input.mono, .mono { font-family: var(--mono); font-size: 13px; }
.row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.dim { color: var(--dim); }
.chip { display: inline-block; padding: 0 7px; border-radius: 9px; font-size: 11px; background: var(--accent-bg); color: var(--accent); margin-left: 4px; }
.chip.overlay { background: var(--overlay-bg); color: var(--overlay); }
.chip.warn { background: var(--warn-bg); color: var(--warn); cursor: pointer; border: 0; padding: 1px 8px; }

/* tree */
.tree { font-size: 13px; }
.tree ul { list-style: none; margin: 0; padding-left: 14px; }
.tree > ul { padding-left: 0; }
.tree .item { display: flex; align-items: center; gap: 3px; padding: 1px 4px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
.tree .item:hover { background: var(--accent-bg); }
.tree .item.selected { background: var(--accent-bg); outline: 1px solid var(--accent); }
.tree .twisty { width: 14px; text-align: center; color: var(--dim); flex: none; }
.tree .name { overflow: hidden; text-overflow: ellipsis; }
.tree .item.origin-overlay .name, .tree .item.origin-both .name { color: var(--overlay); font-weight: 600; }
.tree .labels { color: var(--dim); font-size: 12px; }

/* detail */
table { border-collapse: collapse; width: 100%; }
th { text-align: left; font-weight: 500; color: var(--dim); font-size: 12px; }
td, th { padding: 3px 8px 3px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
tr.prop { cursor: pointer; }
tr.prop:hover td { background: var(--accent-bg); }
tr.prop.selected td { background: var(--accent-bg); }
td.val { font-family: var(--mono); font-size: 13px; word-break: break-all; }
.box { border: 1px solid var(--line); border-radius: 6px; padding: 10px; background: var(--panel); margin-top: 10px; }
.suggestions { display: flex; flex-wrap: wrap; gap: 4px; max-height: 150px; overflow: auto; margin-top: 6px; }
.suggestions button { font-size: 12px; text-align: left; }
.desc { color: var(--dim); font-size: 12.5px; max-height: 96px; overflow: auto; white-space: pre-wrap; margin: 4px 0 8px; }

/* right column */
pre { margin: 0; font: 12.5px/1.45 var(--mono); white-space: pre; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px; max-height: 46vh; }
.issue { border-left: 3px solid var(--warn); background: var(--warn-bg); padding: 4px 8px; margin: 4px 0; font-size: 12.5px; border-radius: 0 4px 4px 0; }
.issue.error { border-color: var(--err); background: var(--err-bg); }
.issue .where { font-family: var(--mono); font-size: 11.5px; color: var(--dim); }

/* log */
footer { border-top: 1px solid var(--line); background: var(--panel); max-height: 22vh; overflow: auto; font: 12px/1.5 var(--mono); padding: 4px 14px; }
footer .entry.fail { color: var(--err); }
footer .stderr { color: var(--warn); white-space: pre-wrap; padding-left: 14px; }
footer .msg { color: var(--dim); padding-left: 14px; }
dialog { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); width: 520px; max-width: 95vw; padding: 16px; }
dialog::backdrop { background: rgba(0,0,0,.4); }
dialog label { display: block; margin-top: 10px; font-size: 12px; color: var(--dim); }
dialog input { width: 100%; }
.pick { max-height: 180px; overflow: auto; border: 1px solid var(--line); border-radius: 5px; margin-top: 4px; }
.pick div { padding: 2px 8px; cursor: pointer; font-family: var(--mono); font-size: 12.5px; }
.pick div:hover { background: var(--accent-bg); }
.busy { opacity: .6; pointer-events: none; }
</style>
</head>
<body>
<header>
    <h1>attach-linux</h1>
    <div class="info" id="info">connecting…</div>
    <span id="busy" class="dim"></span>
    <button id="btn-add">Add device…</button>
    <button id="btn-validate">Validate</button>
    <button id="btn-refresh">Refresh</button>
</header>
<main>
    <section><h2>Device tree</h2><div class="tree" id="tree"></div></section>
    <section id="detail"></section>
    <section>
        <h2>Overlay <span class="dim" id="overlay-path" style="text-transform:none"></span></h2>
        <pre id="overlay"></pre>
        <h2>Validation</h2>
        <div id="validation" class="dim">Not run yet.</div>
    </section>
</main>
<footer id="log"><span class="dim">Every action is an attach-linux command; they show up here.</span></footer>

<dialog id="add-dialog">
    <form method="dialog" id="add-form">
        <strong>Add device</strong>
        <label>Compatible
            <input id="add-compatible" class="mono" autocomplete="off" placeholder="type to search, e.g. adi,ad7124-8">
        </label>
        <div class="pick" id="add-matches" hidden></div>
        <label>Parent
            <input id="add-parent" class="mono" autocomplete="off" placeholder="label or path, e.g. spi0">
        </label>
        <div class="pick" id="add-parents" hidden></div>
        <div class="row" style="margin-top:10px">
            <label style="flex:1">Node name (optional)<input id="add-name" class="mono" placeholder="adc@0"></label>
            <label style="flex:1">Label (optional)<input id="add-label" class="mono" placeholder="adc"></label>
        </div>
        <div class="row" style="margin-top:14px;justify-content:flex-end">
            <button type="button" id="add-cancel">Cancel</button>
            <button type="submit" class="primary" id="add-submit">Add</button>
        </div>
    </form>
</dialog>

<script>
"use strict";
const token = location.hash.slice(1);
history.replaceState(null, "", location.pathname);

// ---------------------------------------------------------------- helpers

function h(tag, props, ...children) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
        if (k === "class") { el.className = v; }
        else if (k.startsWith("on")) { el.addEventListener(k.slice(2), v); }
        else if (v === true) { el.setAttribute(k, ""); }
        else if (v !== false && v != null) { el.setAttribute(k, v); }
    }
    for (const c of children.flat()) {
        if (c == null || c === false) { continue; }
        el.append(c.nodeType ? c : document.createTextNode(String(c)));
    }
    return el;
}
const $ = id => document.getElementById(id);

async function api(path, body) {
    const response = await fetch(path, {
        method: body === undefined ? "GET" : "POST",
        headers: { "x-attach-token": token },
        body: body === undefined ? undefined : JSON.stringify(body),
    });
    const data = await response.json();
    if (!response.ok) { throw new Error(data.error || response.statusText); }
    return data;
}

let pending = 0;
function busy(delta) {
    pending += delta;
    $("busy").textContent = pending > 0 ? "working…" : "";
}

/** Runs one attach-linux command and logs it. Resolves to { ok, json, stderr }. */
async function run(command, args) {
    busy(1);
    const line = ["attach-linux", command, ...args.map(a => /^[\w@.,/:+=-]+$/.test(a) ? a : JSON.stringify(a))].join(" ");
    try {
        const r = await api("/api/cmd", { command, args });
        const ok = r.code === 0 && !(r.json && r.json.ok === false);
        // Configuration problems (exit 2) come as {errors, hints} on stderr.
        let config = null;
        try { const e = JSON.parse(r.stderr); if (Array.isArray(e.errors)) { config = e; } } catch { /* plain text */ }
        const message = config ? config.errors.map(e => e.message).join("; ")
            : r.json && r.json.message ? r.json.message : (r.code === 0 ? "" : r.stdout.trim());
        // Navigation (read, list, validate) only shows up in the log when it fails or warns.
        const quiet = ["read", "list", "validate"].includes(command);
        if (!quiet || !ok || r.stderr.trim()) { log(line, ok, message, config ? "" : r.stderr.trim()); }
        return { ok, json: r.json, stderr: r.stderr, message, config };
    } catch (error) {
        log(line, false, String(error), "");
        return { ok: false, json: null, stderr: "", message: String(error), config: null };
    } finally {
        busy(-1);
    }
}

function log(line, ok, message, stderr) {
    const box = $("log");
    if (box.firstElementChild && box.firstElementChild.tagName === "SPAN") { box.textContent = ""; }
    box.append(h("div", { class: "entry" + (ok ? "" : " fail") }, (ok ? "$ " : "✗ ") + line));
    if (message) { box.append(h("div", { class: "msg" }, message)); }
    if (stderr) { box.append(h("div", { class: "stderr" }, stderr)); }
    box.scrollTop = box.scrollHeight;
}

// ---------------------------------------------------------------- state

const state = {
    loaded: new Map(),      // absolute path -> node read in full
    expanded: new Set(["/"]),
    selected: "/",
    editor: null,           // { path, prop, ... } for the property editor
    addable: null,          // { path, suggestions } for "Add property"
    status: {},
    failure: null,          // the last command that could not read a node
};

const child_path = (parent, key) => (parent === "/" ? "" : parent) + "/" + key;
const parent_path = path => path.slice(0, path.lastIndexOf("/")) || "/";
const path_of = segments => "/" + segments.join("/");

function register(path, node) {
    state.loaded.set(path, node);
    for (const child of node.children) {
        if (!child.collapsed) {
            const p = child_path(path, child.key);
            state.expanded.add(p);
            register(p, child);
        }
    }
}

async function load(path) {
    const r = await run("read", [path]);
    if (!r.ok || !r.json || r.json.kind !== "node") { state.failure = r; return false; }
    register(path, r.json);
    return true;
}

// ---------------------------------------------------------------- value formatting

function cell(v) { return typeof v === "string" ? v : String(v); }
function show(v) {
    if (v === true) { return "(flag)"; }
    if (typeof v === "string") { return v.startsWith("&") ? v : JSON.stringify(v); }
    if (typeof v === "number") { return String(v); }
    if (Array.isArray(v)) {
        if (v.length > 0 && v.every(Array.isArray)) { return v.map(r => "<" + r.map(cell).join(" ") + ">").join(", "); }
        if (v.length > 0 && v.every(x => typeof x === "string" && !x.startsWith("&"))) { return v.map(x => JSON.stringify(x)).join(", "); }
        return "<" + v.map(cell).join(" ") + ">";
    }
    return JSON.stringify(v);
}
function tokens(v) {
    if (v === true || v == null) { return ""; }
    if (Array.isArray(v)) {
        if (v.length > 0 && v.every(Array.isArray)) { return v.map(r => r.map(cell).join(" ")).join(", "); }
        return v.map(cell).join(" ");
    }
    return cell(v);
}
function type_text(t) {
    if (!t) { return ""; }
    switch (t.kind) {
        case "number": return t.subtype === "float" ? "float" : "int";
        case "array": {
            const bounds = t.min_items != null || t.max_items != null ? `[${t.min_items ?? ""}${t.min_items === t.max_items ? "" : ".." + (t.max_items ?? "")}]` : "[]";
            return type_text(t.items) + bounds;
        }
        case "tuple": return "(" + t.items.map(type_text).join(", ") + ")";
        case "enum": return "enum";
        default: return t.kind;
    }
}

// ---------------------------------------------------------------- tree

function render_tree() {
    const build = (path, node) => {
        const open = state.expanded.has(path);
        const full = state.loaded.get(path);
        const labels = (node.alias || []).filter(a => a);
        const expandable = path === "/" || !full || full.children.length > 0 || node.collapsed;
        const item = h("div", {
            class: `item origin-${node.origin || "base"}` + (state.selected === path ? " selected" : ""),
            onclick: () => select(path),
        },
            h("span", { class: "twisty", onclick: ev => { ev.stopPropagation(); toggle(path); } }, expandable ? (open ? "▾" : "▸") : ""),
            h("span", { class: "name", title: path }, path === "/" ? "/" : node.key),
            labels.length ? h("span", { class: "labels" }, labels.map(l => "&" + l).join(" ")) : null,
            node.origin === "overlay" ? h("span", { class: "chip overlay" }, "new") : null,
        );
        const li = h("li", {}, item);
        if (open && full) {
            li.append(h("ul", {}, full.children.map(c => build(child_path(path, c.key), state.loaded.get(child_path(path, c.key)) || c))));
        }
        return li;
    };
    const root = state.loaded.get("/");
    $("tree").replaceChildren(root ? h("ul", {}, build("/", root)) : "");
}

async function toggle(path) {
    if (state.expanded.has(path)) { state.expanded.delete(path); render_tree(); return; }
    state.expanded.add(path);
    if (!state.loaded.has(path)) { await load(path); }
    render_tree();
}

async function select(path) {
    state.selected = path;
    state.editor = null;
    state.addable = null;
    if (!state.loaded.has(path)) { await load(path); }
    render_tree();
    render_detail();
}

// ---------------------------------------------------------------- detail

function render_detail() {
    const path = state.selected;
    const node = state.loaded.get(path);
    const box = $("detail");
    if (!node) { box.replaceChildren(h("p", { class: "dim" }, "Select a node.")); return; }

    const status = node.properties.find(p => p.key === "status");
    const disabled = status && status.value === "disabled";
    const labels = (node.alias || []);

    box.replaceChildren(...[
        h("h2", {}, "Node"),
        h("div", { class: "row" },
            h("strong", { class: "mono" }, path),
            labels.map(l => h("span", { class: "chip" }, "&" + l)),
            h("span", { class: "chip" + (node.origin === "base" ? "" : " overlay") }, node.origin === "base" ? "base only" : node.origin === "both" ? "base + overlay" : "added by overlay"),
            status ? h("span", { class: "chip" + (disabled ? " warn" : " overlay") }, disabled ? "disabled" : String(status.value)) : null,
        ),
        h("div", { class: "row", style: "margin-top:8px" },
            h("button", { onclick: () => set_status("enable") }, "Enable"),
            h("button", { onclick: () => set_status("disable") }, "Disable"),
            h("button", { onclick: () => open_add(path) }, "Add device here…"),
            h("button", { class: "danger", disabled: path === "/", onclick: delete_node }, "Delete node"),
        ),
        node.missing_required && node.missing_required.length
            ? h("div", { class: "row", style: "margin-top:8px" }, h("span", { class: "dim" }, "Missing required:"),
                node.missing_required.map(p => h("button", { class: "chip warn", onclick: () => open_editor(path, p) }, p)))
            : null,
        h("h2", {}, "Properties"),
        h("table", {},
            h("tr", {}, h("th", {}, "name"), h("th", {}, "value"), h("th", {}, "from"), h("th", {}, "type")),
            node.properties.map(p => h("tr", { class: "prop" + (state.editor && state.editor.prop === p.key ? " selected" : ""), onclick: () => open_editor(path, p.key) },
                h("td", { class: "mono" }, p.key),
                h("td", { class: "val", title: JSON.stringify(p.value) }, show(p.value)),
                h("td", {}, h("span", { class: "chip" + (p.source === "overlay" ? " overlay" : "") }, p.source)),
                h("td", { class: "dim" }, type_text(p.type)),
            )),
        ),
        h("div", { class: "row", style: "margin-top:8px" },
            h("button", { onclick: show_addable }, "Add property…"),
        ),
        state.addable ? render_addable() : null,
        state.editor ? render_editor() : null,
    ].filter(Boolean));
}

async function refresh(extra) {
    const paths = new Set(["/", state.selected, ...state.expanded]);
    for (const p of extra || []) { paths.add(p); }
    state.loaded.clear();
    // Parents first, so a child read in full by its parent is read again afterwards.
    for (const p of [...paths].sort((a, b) => a.length - b.length)) {
        if (!(await load(p))) { state.expanded.delete(p); }
    }
    if (!state.loaded.has(state.selected)) { state.selected = "/"; }
    render_tree();
    render_detail();
    await Promise.all([refresh_overlay(), validate()]);
}

async function mutate(command, args) {
    const r = await run(command, args);
    await refresh();
    return r;
}

async function set_status(verb) { await mutate(verb, [state.selected]); }

async function delete_node() {
    const path = state.selected;
    const preview = await run("delete", [path]);
    if (preview.json && preview.json.node_count !== undefined && preview.json.severity === "warn") {
        if (!confirm(`${preview.message}.\nDelete them?`)) { return; }
        const r = await run("delete", [path, "--force"]);
        if (!r.ok) { return; }
    } else if (!preview.ok) { return; }
    for (const p of [...state.expanded]) { if (p === path || p.startsWith(path + "/")) { state.expanded.delete(p); } }
    state.selected = parent_path(path);
    state.editor = null;
    await refresh();
}

// ---------------------------------------------------------------- property editor

async function open_editor(path, prop) {
    const node = state.loaded.get(path);
    const existing = node && node.properties.find(p => p.key === prop);
    state.addable = null;
    state.editor = { path, prop, existing, description: "", suggestions: [], type: existing ? type_text(existing.type) : "", input: existing ? tokens(existing.value) : "" };
    render_detail();

    let info = null;
    if (existing) {
        const r = await run("read", [path, prop]);
        if (r.json && r.json.kind === "property") { info = r.json; }
    }
    let suggestions = info ? (info.suggestions || []) : [];
    let description = info ? info.description || "" : "";
    if (!info) {
        const p = await run("list", ["property", path, prop]);
        if (p.json && p.json.type) {
            state.editor.type = type_text(p.json.type);
            description = p.json.description || "";
        }
        const v = await run("list", ["value", path, prop]);
        if (v.json && v.json.suggestions) { suggestions = v.json.suggestions; }
    }
    if (!state.editor || state.editor.prop !== prop || state.editor.path !== path) { return; }
    Object.assign(state.editor, { description, suggestions });
    render_detail();
    const input = document.getElementById("editor-input");
    if (input) { input.focus(); }
}

function render_editor() {
    const e = state.editor;
    const fromOverlay = e.existing && e.existing.source === "overlay";
    const apply = async () => {
        const value = $("editor-input").value.trim();
        const args = [e.path, e.prop, ...(value ? value.split(/\s+/) : [])];
        const r = await mutate("update", args);
        if (r.ok) { state.editor = null; await refresh_after_edit(e.path, e.prop); }
    };
    return h("div", { class: "box" },
        h("div", { class: "row" }, h("strong", { class: "mono" }, e.prop), h("span", { class: "dim" }, e.type), h("span", { style: "flex:1" }),
            h("button", { onclick: () => { state.editor = null; render_detail(); } }, "Close")),
        e.description ? h("div", { class: "desc" }, e.description) : null,
        h("div", { class: "row" },
            h("input", {
                id: "editor-input", class: "mono", style: "flex:1", value: e.input, placeholder: e.type === "bool" ? "empty sets the flag" : "value tokens, e.g. 19 IRQ_TYPE_EDGE_FALLING",
                oninput: ev => { e.input = ev.target.value; },
                onkeydown: ev => { if (ev.key === "Enter") { apply(); } },
            }),
            h("button", { class: "primary", onclick: apply }, "Apply"),
            h("button", { class: "danger", disabled: !fromOverlay, title: fromOverlay ? "Remove from the overlay" : "Only the overlay's own values can be removed", onclick: remove_property }, "Remove"),
        ),
        e.suggestions.length
            ? [h("div", { class: "dim", style: "margin-top:8px;font-size:12px" }, "Suggestions"),
               h("div", { class: "suggestions" }, e.suggestions.map(s => h("button", {
                   title: s.note || s.display_string || s.value,
                   onclick: () => { e.input = s.value; $("editor-input").value = s.value; $("editor-input").focus(); },
               }, s.display_string || s.value || "(flag)")))]
            : null,
    );
}

async function refresh_after_edit(path, prop) {
    const node = state.loaded.get(path);
    if (node && node.properties.some(p => p.key === prop)) { await open_editor(path, prop); }
}

async function remove_property() {
    const e = state.editor;
    const r = await mutate("delete", [e.path, e.prop]);
    if (r.ok) { state.editor = null; render_detail(); }
}

// ---------------------------------------------------------------- add property / child

async function show_addable() {
    state.editor = null;
    const path = state.selected;
    const r = await run("list", ["property", path]);
    state.addable = { path, suggestions: r.json && r.json.suggestions ? r.json.suggestions : [], failed: !r.ok };
    render_detail();
}

function render_addable() {
    const a = state.addable;
    if (a.failed || a.suggestions.length === 0) { return h("div", { class: "box dim" }, "No binding for this node, so there is nothing to suggest. Check the log."); }
    const set = new Set((state.loaded.get(a.path) || { properties: [] }).properties.map(p => p.key));
    return h("div", { class: "box" },
        h("div", { class: "dim", style: "font-size:12px" }, "From the binding; pick one to set it, or a child node pattern to create a child."),
        h("div", { class: "suggestions", style: "max-height:220px" }, a.suggestions.filter(s => !set.has(s.value)).map(s => h("button", {
            title: s.display_string || s.value,
            onclick: () => pick_addable(s),
        }, s.value.startsWith("^") ? "＋ " + (s.display_string || s.value).split(" (")[0] : s.display_string || s.value))),
    );
}

async function pick_addable(s) {
    const path = state.addable.path;
    if (s.value.startsWith("^")) {
        const stem = (s.display_string || "").split(/[ …]/)[0];
        const name = prompt("Child node name (it must match " + s.value + ")", stem);
        if (!name) { return; }
        state.addable = null;
        const r = await mutate("update", [path, name]);
        if (r.ok) {
            state.expanded.add(path);
            await select(child_path(path, name));
            const first = r.json && r.json.missing_required && r.json.missing_required[0];
            if (first) { await open_editor(child_path(path, name), first.property); }
        }
        return;
    }
    state.addable = null;
    await open_editor(path, s.value);
}

// ---------------------------------------------------------------- add device dialog

let devices = null;
async function open_add(parent) {
    const dialog = $("add-dialog");
    $("add-compatible").value = "";
    $("add-parent").value = parent && parent !== "/" ? parent : "";
    $("add-name").value = "";
    $("add-label").value = "";
    $("add-matches").hidden = true;
    $("add-parents").hidden = true;
    dialog.showModal();
    $("add-compatible").focus();
    if (!devices) {
        const r = await run("list", ["devices"]);
        devices = r.json && r.json.names ? r.json.names : [];
    }
}

function filter_devices() {
    const q = $("add-compatible").value.trim().toLowerCase();
    const box = $("add-matches");
    if (!q || !devices) { box.hidden = true; return; }
    const hits = devices.filter(d => d.toLowerCase().includes(q)).slice(0, 60);
    box.replaceChildren(...hits.map(d => h("div", { onclick: () => pick_device(d) }, d)));
    box.hidden = hits.length === 0;
}

async function pick_device(compatible) {
    $("add-compatible").value = compatible;
    $("add-matches").hidden = true;
    const r = await run("list", ["parent", compatible]);
    const parents = r.json && r.json.suggestions ? r.json.suggestions : [];
    const box = $("add-parents");
    box.replaceChildren(...parents.map(p => h("div", { onclick: () => { $("add-parent").value = p.value; box.hidden = true; } }, p.display_string ? `${p.value}  ${p.display_string}` : p.value)));
    box.hidden = parents.length === 0;
    if (parents.length === 0) { return; }
    if (!$("add-parent").value) { $("add-parent").focus(); }
}

async function submit_add(ev) {
    ev.preventDefault();
    const compatible = $("add-compatible").value.trim();
    if (!compatible) { return; }
    const args = [compatible];
    for (const [flag, id] of [["--parent", "add-parent"], ["--name", "add-name"], ["--label", "add-label"]]) {
        const v = $(id).value.trim();
        if (v) { args.push(flag, v); }
    }
    $("add-dialog").close();
    const r = await run("add", args);
    if (!r.ok || !r.json || !r.json.path) { return; }
    const path = path_of(r.json.path);
    if (!state.status.overlay) {
        // The add created the workfile.
        state.status = await api("/api/status");
        $("info").textContent = `Linux: ${state.status.linux ?? "?"} · Base: ${state.status.devicetree ?? "?"} · Overlay: ${state.status.overlay ?? "none yet"}`;
    }
    for (let p = parent_path(path); ; p = parent_path(p)) { state.expanded.add(p); if (p === "/") { break; } }
    state.selected = path;
    state.editor = null;
    await refresh([path]);
}

// ---------------------------------------------------------------- overlay and validation

async function refresh_overlay() {
    const r = await api("/api/overlay");
    $("overlay-path").textContent = r.path ? "· " + r.path.split("/").pop() : "";
    $("overlay").textContent = r.path ? (r.text || "(empty)") : "No overlay yet. Add a device, or create a workfile.";
}

async function validate() {
    const box = $("validation");
    const r = await run("validate", []);
    if (!r.json || !r.json.errors) {
        box.replaceChildren(h("div", { class: "issue error" }, r.message || r.stderr || "validate failed"));
        return;
    }
    const issue = (kind, i) => h("div", { class: "issue" + (kind === "error" ? " error" : "") }, h("div", { class: "where" }, i.path.join("/")), i.message);
    const all = [...r.json.errors.map(i => issue("error", i)), ...r.json.warnings.map(i => issue("warn", i))];
    box.replaceChildren(...(all.length ? all : [h("div", { class: "chip overlay" }, "no errors or warnings")]));
}

// ---------------------------------------------------------------- start

$("btn-add").onclick = () => open_add(state.selected);
$("btn-refresh").onclick = () => refresh();
$("btn-validate").onclick = () => validate();
$("add-cancel").onclick = () => $("add-dialog").close();
$("add-compatible").oninput = filter_devices;
$("add-form").onsubmit = submit_add;

/** Says why the device tree could not be read: the CLI's own configuration errors when it gave them. */
function render_failure() {
    const f = state.failure;
    const errors = f && f.config ? f.config.errors : [{ message: (f && (f.message || f.stderr.trim())) || "unknown error" }];
    const hints = f && f.config && f.config.hints ? f.config.hints : [];
    const overlay_problem = errors.some(e => e.field === "overlay");
    $("detail").replaceChildren(...[
        h("h2", {}, "Could not read the device tree"),
        errors.map(e => h("div", { class: "issue error" }, e.field ? h("div", { class: "where" }, e.field) : null, e.message)),
        hints.map(t => h("p", { class: "dim" }, t)),
        h("div", { class: "row" },
            overlay_problem ? h("button", { class: "primary", onclick: async () => { if (await create_workfile()) { await init(); } } }, "Create a new workfile") : null,
            h("button", { onclick: () => init() }, "Retry"),
        ),
    ].flat().filter(Boolean));
}

/** Creates a workfile with `init`, which takes the first of overlay, overlay-1, ... that doesn't exist yet. */
async function create_workfile() {
    const r = await run("init", []);
    return r.ok;
}

async function init() {
    try {
        state.status = await api("/api/status");
    } catch (error) {
        $("info").textContent = "Cannot reach the server: " + error.message;
        return;
    }
    const s = state.status;
    $("info").textContent = `Linux: ${s.linux ?? "not set"} · Base: ${s.devicetree ?? "not set"} · Overlay: ${s.overlay ?? "none yet"}`;
    $("tree").replaceChildren();
    if (!s.overlay) {
        $("detail").replaceChildren(...[
            !s.linux || !s.devicetree
                ? h("div", { class: "issue error" }, "Not configured: " + [!s.linux && "linux", !s.devicetree && "devicetree"].filter(Boolean).join(", ") + ". Run 'attach-linux' in this directory.")
                : null,
            h("h2", {}, "No overlay yet"),
            h("p", {}, "The overlay file (workfile) is where your changes are written. Create an empty one, or add a device, which creates it for you."),
            h("div", { class: "row" },
                h("button", { class: "primary", onclick: async () => { if (await create_workfile()) { await init(); } } }, "Create workfile"),
                h("button", { onclick: () => open_add("/") }, "Add device…"),
            ),
        ].flat().filter(Boolean));
        $("overlay").textContent = "";
        return;
    }
    state.loaded.clear();
    if (!(await load("/"))) { render_failure(); return; }
    await select("/");
    await Promise.all([refresh_overlay(), validate()]);
}
init();
</script>
</body>
</html>
