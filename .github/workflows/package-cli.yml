name: Build and Package CLI

on:
  workflow_dispatch:
  push:
    branches: [main, ci/**]
    paths:
      - 'packages/cli/**'
      - 'packages/attach-lib/**'
      - 'packages/attach-no-os-lib/**'
  pull_request:
    paths:
      - 'packages/cli/**'
      - 'packages/attach-lib/**'
      - 'packages/attach-no-os-lib/**'

permissions:
  contents: read

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      # The CLI's build bundles a static dtc and the dt-schema tools
      # (packages/cli/scripts/bundle-dt-schema.sh): dtc is built with make, flex
      # and bison, dt-mk-schema and dt-validate with PyInstaller in a venv.
      - name: Install the tools of the bundled dt-schema build
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler flex bison python3-venv
          dtc --version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # attach-lib and attach-no-os-lib, then the CLI, which bundles both and
      # runs scripts/bundle-dt-schema.sh into packages/cli/bundled/.
      - name: Build the CLI
        run: yarn build:cli

      - name: Package CLI
        run: |
          cd packages/cli
          yarn pack --out ../../analog-attach-cli.tgz
          tar -tzf ../../analog-attach-cli.tgz | grep -q '^package/bundled/linux/tools/dt-validate$'
          tar -tzf ../../analog-attach-cli.tgz | grep -q '^package/skills/linux/SKILL.md$'

      - name: Upload CLI package
        uses: actions/upload-artifact@v4
        with:
          name: analog-attach-cli
          path: analog-attach-cli.tgz

  # Optional: Test the packaged CLI installs correctly
  test-package:
    needs: build-and-package
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25

      - name: Download CLI package
        uses: actions/download-artifact@v4
        with:
          name: analog-attach-cli

      - name: Install packaged CLI
        run: npm install -g ./analog-attach-cli.tgz

      - name: Verify CLI works
        run: |
          analog-attach --version
          analog-attach --help
