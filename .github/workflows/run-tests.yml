name: Run Application Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      # dtc for the tests; flex, bison and python3-venv for the CLI's bundled
      # dtc and dt-schema tools (packages/cli/scripts/bundle-dt-schema.sh, run by
      # its build, as scripts/verify.sh does).
      - name: Install dtc and the tools of the bundled dt-schema build
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler flex bison python3-venv
          dtc --version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build:all

      - name: Test
        run: xvfb-run --auto-servernum yarn test-clean
