name: Run Application Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Two jobs that share nothing, side by side: the unit tests of every package, and the
# functional tests of the CLI (packages/cli/test/functional) with their requirements report.
jobs:
  # On the oldest Node the CLI supports (its engines, >=22) and on the current LTS, so a change
  # that needs a newer Node fails here rather than for a user.
  unit:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 26]
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      # dtc for the tests; flex, bison and python3-venv for the CLI's bundled
      # dtc and dt-schema tools (packages/cli/scripts/bundle-dt-schema.sh, run by
      # its build, as scripts/verify.sh does).
      - name: Install dtc and the tools of the bundled dt-schema build
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler flex bison python3-venv
          dtc --version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build:all

      - name: Test
        run: xvfb-run --auto-servernum yarn test-clean

  functional:
    name: Functional tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      # flex, bison and python3-venv for the CLI's build (its bundled dt-schema tools); jq for
      # the tests; GNU parallel for bats --jobs.
      - name: Install the tools of the build and the tests
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler flex bison python3-venv jq parallel

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: yarn

      # The workbooks (test-spec.xlsx, test-report.xlsx) need openpyxl, and the manual and planned
      # tests (manual-tests.yaml) PyYAML; the CSVs need neither.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install openpyxl and PyYAML
        run: python -m pip install openpyxl pyyaml

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # The CLI and the two libraries it bundles; the tests run dist/cli.js.
      - name: Build the CLI
        run: yarn build:cli

      # Every test, the known gaps too (tagged gap): they are reported, but only a test that
      # fails and isn't a known gap fails the job, and so does a test without its ID,
      # Description, Steps or Preconditions (--require-steps). The build and deploy tests that
      # need real CAPI trees and a toolchain skip here.
      - name: Run the functional tests
        run: yarn test:functional --jobs 4 --fail-unless-gap --require-steps

      - name: Write the requirements report to the run's summary
        if: always()
        run: |
          summary=packages/cli/test/functional/out/summary.md
          if [ -f "$summary" ]; then cat "$summary" >> "$GITHUB_STEP_SUMMARY"; fi

      # Two artifacts: the specification (what is tested, and how; the same for every run of a
      # commit) and the report of this run, with its CSVs, summary and bats' JUnit.
      - name: Upload the test specification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-test-spec
          path: |
            packages/cli/test/functional/out/test-spec.xlsx
            packages/cli/test/functional/out/test-spec.csv
          if-no-files-found: warn

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-test-report
          path: |
            packages/cli/test/functional/out/
            !packages/cli/test/functional/out/test-spec.*
          if-no-files-found: warn
